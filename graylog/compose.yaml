# Stack de logs: rsyslog, Graylog, OpenSearch e MongoDB.
name: oficina-graylog

services:
  rsyslog:
    build: ../rsyslog
    image: oficina-rsyslog:1.0
    volumes:
      - rsyslog_fila:/var/spool/rsyslog:rw
      - ../rsyslog/rsyslog.conf:/etc/rsyslog.conf:ro
    networks:
      aplicacao:
        ipv4_address: 172.30.10.20
      logs:
        ipv4_address: 172.30.20.20
    restart: always

  graylog:
    image: graylog/graylog:7.2.2
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:?}
      GRAYLOG_HTTP_BIND_ADDRESS: 0.0.0.0:9000
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9000/
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_SERVER_JAVA_OPTS: -Xms512m -Xmx1g
      GRAYLOG_ROOT_TIMEZONE: America/Sao_Paulo
      GRAYLOG_TELEMETRY_ENABLED: "false"
    volumes:
      - graylog_dados:/usr/share/graylog/data
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      logs:
        ipv4_address: 172.30.20.30
    depends_on:
      mongodb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  graylog-init:
    image: curlimages/curl:8.17.0
    entrypoint: ["sh", "/criar-input.sh"]
    secrets:
      - graylog_admin_password
    volumes:
      - ./criar-input.sh:/criar-input.sh:ro
    networks: [logs]
    depends_on:
      - graylog
    restart: on-failure:3

  mongodb:
    image: mongo:7.0.45
    volumes:
      - mongodb_dados:/data/db
    networks:
      logs:
        ipv4_address: 172.30.20.40
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.19.7
    environment:
      discovery.type: single-node
      action.auto_create_index: "false"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch_dados:/usr/share/opensearch/data
    networks:
      logs:
        ipv4_address: 172.30.20.50
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

networks:
  aplicacao:
    external: true
    name: oficina_aplicacao
  logs:
    name: oficina_logs
    ipam:
      config:
        - subnet: 172.30.20.0/24
          gateway: 172.30.20.1
          ip_range: 172.30.20.128/25

secrets:
  graylog_admin_password:
    file: ./admin_password.txt

volumes:
  rsyslog_fila:
  graylog_dados:
  mongodb_dados:
  opensearch_dados:
