# Recebe logs da aplicação por UDP e encaminha ao Graylog por TCP.

global(workDirectory="/var/spool/rsyslog")

# Entrada: syslog UDP vindo da aplicação.
module(load="imudp")
input(type="imudp" port="514")

# Cópia local: permite acompanhar com `docker compose logs rsyslog`.
action(type="omfile" file="/dev/stdout" template="RSYSLOG_TraditionalFileFormat")

# Saída: Graylog. A fila em disco é o motivo de ter o rsyslog no meio:
# se o Graylog cair (ou ainda estiver subindo), as mensagens ficam guardadas
# e são entregues quando ele voltar.
action(
  type="omfwd"
  target="graylog"
  port="1514"
  protocol="tcp"
  template="RSYSLOG_SyslogProtocol23Format"
  queue.type="LinkedList"
  queue.filename="graylog_fwd"
  queue.maxDiskSpace="100m"
  queue.saveOnShutdown="on"
  action.resumeRetryCount="-1"
  action.resumeInterval="5"
)
